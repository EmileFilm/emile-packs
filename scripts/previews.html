<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#111">
<script type="module">
// The page scripts/previews.mjs drives: each frame of a pack's preview
// drawn by Émile's own compositor, as the product draws it.
//
// A filter or a look, over its own clip (scripts/footage.json): the footage as it is,
// wiped to the filter from the left, held, wiped back. A transition,
// between two cards drawn here so its movement reads at a glance (a solid
// colour each, a big A and a big B): card A, the transition once into
// card B, held, then B fades back into A. Both loop: a filter's footage
// crossfades its last frames into its first, a transition ends on the
// frame it starts with.

const query = new URLSearchParams(location.search)
const { createCompositor } = await import(query.get('compositor'))

const W = 854, H = 480
const N = 96 // 4 s at 24 fps
const LOOP = 12 // frames a filter's footage crossfades over at its seam
const canvasOf = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h })

let packs = {}, comp = null, glCanvas = null
const footage = { a: [] }

// The cards a transition goes between: A deep blue, B warm orange, each
// letter in the other's colour
function card(letter, fill, ink) {
  const c = canvasOf(W, H), x = c.getContext('2d')
  x.fillStyle = fill
  x.fillRect(0, 0, W, H)
  x.fillStyle = ink
  x.font = `700 ${Math.round(H * 0.62)}px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif`
  x.textAlign = 'center'
  x.textBaseline = 'middle'
  x.fillText(letter, W / 2, H / 2 + H * 0.03)
  return c
}
const cards = { a: card('A', '#1f3a8a', '#f59e42'), b: card('B', '#f59e42', '#1f3a8a') }
const problems = []

async function load(urls) {
  return Promise.all(urls.map(async url => {
    const image = new Image()
    image.src = url
    await image.decode()
    return image
  }))
}

// Footage a at frame i, its seam crossfaded: the first LOOP frames come in
// from the frames after the end, so frame N - 1 runs on into frame 0
const scratch = canvasOf(W, H), sg = scratch.getContext('2d')
function looped(i) {
  if (i >= LOOP) return footage.a[i]
  sg.globalAlpha = 1
  sg.drawImage(footage.a[N + i], 0, 0, W, H)
  sg.globalAlpha = i / LOOP
  sg.drawImage(footage.a[i], 0, 0, W, H)
  sg.globalAlpha = 1
  return scratch
}

const ease = t => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t))

function drawTree(tree, pictures) {
  comp.frame(tree, n => ({ image: pictures[n.id], stacked: false }))
  if (problems.length) throw new Error(problems.join('; '))
}

const out = canvasOf(W, H), g = out.getContext('2d')

// A filter's frame i: how far the wipe has gone from the left (0–1)
const wipe = i => (i < 12 ? 0 : i < 36 ? ease((i - 12) / 24) : i < 72 ? 1 : i < 90 ? 1 - ease((i - 72) / 18) : 0)

// What is drawn over the footage at frame i: a filter at its defaults, or a
// look's filters one over another, bottom first, each as the look sets it
function over(id, i) {
  const footage = { op: 'stack', layers: [{ op: 'clip', id: 'a', f: i }] }
  const list = packs[id].kind === 'look' ? packs[id].filters : [{ id, params: {} }]
  return list.reduce((src, f) => ({
    op: 'filter', id: f.id, params: f.params ?? {}, seed: f.seed ?? 1234, frame: i,
    ...(f.amount != null ? { amount: f.amount } : {}), ...(f.blend ? { blend: f.blend } : {}), src
  }), footage)
}

function filterFrame(id, i) {
  const base = looped(i)
  // The footage as it is first: base may be the scratch canvas, which the
  // compositor reads next
  g.drawImage(base, 0, 0, W, H)
  const x = Math.round(wipe(i) * W)
  if (x > 0) {
    drawTree(over(id, i), { a: base })
    g.save()
    g.beginPath()
    g.rect(0, 0, x, H)
    g.clip()
    g.drawImage(glCanvas, 0, 0, W, H)
    g.restore()
    // The wipe's edge, a hairline while it moves
    if (x < W) {
      g.fillStyle = 'rgba(255,255,255,0.75)'
      g.fillRect(x - 1, 0, 2, H)
    }
  }
}

// A transition's frame i: card A until 30, the blend over 30–54, card B
// after it, fading back to A over the last 12
const FROM = 30, LEN = 24, BACK = 84
function transitionFrame(id, i) {
  if (i < FROM) return g.drawImage(cards.a, 0, 0, W, H)
  if (i < FROM + LEN) {
    const p = (i - FROM + 1) / (LEN + 1)
    drawTree({ op: 'blend', id, params: {}, p, frame: i, after: p >= 0.5, a: { op: 'clip', id: 'a', f: i }, b: { op: 'clip', id: 'b', f: i - FROM } }, cards)
    return g.drawImage(glCanvas, 0, 0, W, H)
  }
  g.globalAlpha = 1
  g.drawImage(cards.b, 0, 0, W, H)
  if (i >= BACK) {
    g.globalAlpha = (i - BACK + 1) / (N - BACK + 1)
    g.drawImage(cards.a, 0, 0, W, H)
    g.globalAlpha = 1
  }
}

window.Preview = {
  N,
  // all: the packs by id ({ kind, params, glsl, passes })
  async setup(all) {
    packs = all
    glCanvas = canvasOf(W, H)
    comp = createCompositor(glCanvas, { width: W, height: H, packs, fps: 24, onProblem: m => problems.push(m) })
    return true
  },
  // The clip the next filter is drawn over: its frames, file URLs, N +
  // LOOP at least
  async footage(a) {
    if (a.length < N + LOOP) throw new Error(`the clip has ${a.length} frames, ${N + LOOP} are needed`)
    footage.a = await load(a)
    return true
  },
  // Frame i of a pack's preview, a JPEG data URL
  frame(id, i) {
    if (packs[id].kind === 'transition') transitionFrame(id, i)
    else filterFrame(id, i)
    return out.toDataURL('image/jpeg', 0.95)
  }
}
window.ready = true
</script>
