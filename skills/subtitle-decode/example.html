<style>
  .subs { position: absolute; inset: 0; }
  .band { position: absolute; left: var(--band-left); top: var(--band-top); width: var(--band-width); height: var(--band-height);
    display: flex; align-items: center; justify-content: center; }
  .sub { --u: var(--band-height); max-width: 100%; text-align: center; text-wrap: balance; }
  .sub .w { display: inline-block; }
  .subs { --sub-ink: #eafff1; --sub-dim: rgba(140, 255, 180, 0.35); --sub-accent: #8cffb4; --sub-shadow: #000; }
  .sub { font: 600 calc(var(--u) * 0.32) / 1.25 'JetBrains Mono', monospace; color: var(--sub-ink);
    text-shadow: 0 0 0.25em color-mix(in srgb, var(--sub-shadow) 80%, transparent); }
  .sub .next { color: var(--sub-dim); }
  .sub .on { color: var(--sub-accent); }

<script type="module">
  import { subtitle } from 'engine/subtitle.js'

  // Scrambled letters, seeded by the clip's time (a fresh set 20 times a
  // second), so every frame is the same each time it is drawn
  const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&*+<>/'
  const pick = (a, b, c) => GLYPHS[Math.abs(((a * 73856093) ^ (b * 19349663) ^ (c * 83492791)) | 0) % GLYPHS.length]
  function scramble(t, ctx) {
    const step = Math.floor(t * 20)
    ctx.root.querySelectorAll('.sub .w').forEach((w, i) => {
      if (w.classList.contains('past')) return
      const text = w.textContent
      const keep = w.classList.contains('on') ? Math.floor(parseFloat(w.style.getPropertyValue('--said')) * text.length) : 0
      w.textContent = [...text].map((ch, k) => (k < keep || /[\s\p{P}]/u.test(ch) ? ch : pick(step, i, k))).join('')
    })
  }

  export function draw(t, ctx) {
    subtitle(t, ctx, { words: 'follow', chunk: [28, 12] })
    scramble(t, ctx)
  }
</script>
