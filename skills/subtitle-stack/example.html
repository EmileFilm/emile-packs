<style>
  .subs { position: absolute; inset: 0; }
  .band { position: absolute; left: var(--band-left); top: var(--band-top); width: var(--band-width); height: var(--band-height);
    display: flex; align-items: center; justify-content: center; }
  .sub { --u: var(--band-height); max-width: 100%; text-align: center; text-wrap: balance; }
  .sub .w { display: inline-block; }
  .subs { --sub-ink: #fff; --sub-accent: #ffd400; --sub-shadow: #000; }
  .band { left: var(--safe-left); top: var(--safe-top); width: var(--safe-width); height: var(--safe-height); }
  .band { container-type: size; }
  .sub { --long: 6; display: flex; flex-direction: column; align-items: center; gap: 0;
    font: 400 min(calc(88cqh / var(--n, 3)), calc(100cqw / (var(--long) * 0.42))) / 0.9 'Anton', sans-serif; text-transform: uppercase; color: var(--sub-ink);
    text-shadow: 0 0.03em 0.08em color-mix(in srgb, var(--sub-shadow) 45%, transparent); }
  .sub .w { opacity: var(--in); translate: 0 calc((1 - var(--in)) * 0.25em); }
  .sub .kw { color: var(--sub-accent); }
</style>
<script type="module">
  import { subtitle } from 'engine/subtitle.js'

  // How many lines and the longest word, so the stack fills the frame (CSS: --n, --long)
  function fit(t, ctx) {
    const sub = ctx.root.querySelector('.sub')
    const words = [...(sub?.querySelectorAll('.w') ?? [])]
    if (!words.length) return
    sub.style.setProperty('--n', String(words.length))
    sub.style.setProperty('--long', String(Math.max(4, ...words.map(w => [...w.textContent].length))))
  }

  export function draw(t, ctx) {
    subtitle(t, ctx, { words: 'line', chunk: [18, 8], enter: 0.16 })
    fit(t, ctx)
  }
</script>
